name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # 1. Tải mã nguồn từ repository xuống máy chủ ảo của GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # 3. Cài đặt các thư viện dự án (Next.js, Supabase, Playwright...)
      - name: Install dependencies
        run: npm ci

      # 4. Cài đặt trình duyệt Playwright cần thiết (Chromium, Firefox, WebKit...)
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 5. Chạy bộ kiểm thử E2E (truyền các biến môi trường từ GitHub Secrets)
      - name: Run Playwright tests
        run: npx playwright test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # 6. (Tùy chọn) Tự động lưu báo cáo test (HTML Report) nếu test fail
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
